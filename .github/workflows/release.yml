# Runs when main changes (a pull request was merged). If Cargo.toml's version has no GitHub Release
# yet, it builds the Windows installer and publishes the release (which also creates the v<version> tag).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # create the Release/tag and upload the installer

jobs:
  release:
    runs-on: windows-latest # comes with Rust (MSVC), Node.js and the Windows SDK
    steps:
      - uses: actions/checkout@v5

      - name: Is this version already released?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '\r' < Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # before `cargo test`: compiling the app at all (tauri-build) requires the bundled ffmpeg to exist
      - if: steps.version.outputs.new == 'true'
        run: ./scripts/get-ffmpeg.ps1
      - if: steps.version.outputs.new == 'true'
        run: cargo test
      - if: steps.version.outputs.new == 'true'
        run: npx --yes @tauri-apps/cli@2.12.4 build # pinned: installer/installer.nsi is this version's template

      - name: Publish the GitHub Release
        if: steps.version.outputs.new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Tauri names it "ArgonStream_<version>_x64-setup.exe"; publish it under a name with the dash
          cp "target/release/bundle/nsis/ArgonStream_${VERSION}_x64-setup.exe" "ArgonStream-Setup-${VERSION}.exe"
          gh release create "v$VERSION" "ArgonStream-Setup-${VERSION}.exe" --target "$GITHUB_SHA" --title "ArgonStream v$VERSION" --generate-notes
